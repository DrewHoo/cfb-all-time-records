name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In season, the games since the NCAA's total stops: Friday after Streak
  # King's Friday refresh (Thursday's games), Sunday after its Sunday refresh
  # (Saturday's; its 14:00 crons have run as late as 17:30 UTC), and Monday
  # in case that one ran later still. August through the January playoff.
  schedule:
    - cron: '0 19 * 1,8-12 5'
    - cron: '0 22 * 1,8-12 0'
    - cron: '0 13 * 1,8-12 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The running season from Streak King's published payload, on the
      # scheduled and manual runs; a push builds the committed
      # src/data/current.json. A failed fetch builds the committed file too.
      - if: github.event_name != 'push'
        run: node scripts/build-current.mjs || git checkout -- src/data/current.json
      # vite build, then scripts/prerender.mjs bakes both pages' markup in
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The share worker (workers/share) bundles src/lib and the data, so it
  # ships with the site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token
  # made from the "Edit Cloudflare Workers" template
  # (gh secret set CLOUDFLARE_API_TOKEN --repo DrewHoo/cfb-all-time-records).
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3' # the devDependency's version, so by-hand and CI deploys match
          command: deploy -c workers/share/wrangler.jsonc
