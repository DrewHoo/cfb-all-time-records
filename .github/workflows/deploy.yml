name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In season, the games since the NCAA's total stops, and the bowls since the
  # bowl page's: every day at 19:00 and 23:00 UTC, August through the January
  # title game, the check job below builds only when Streak King's payload has
  # been rebuilt since the live board's. So the board follows Streak King's
  # refreshes (Thursday 13:00, Friday and Sunday 14:00 UTC, which have run as
  # late as 17:30; every day at 13:00 in December and January 1-27, for the
  # bowls and the playoff) a few hours behind, without a schedule of its own
  # to keep in step.
  schedule:
    - cron: '0 19,23 * 1,8-12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # A scheduled run builds only when the payload's builtAt differs from the
  # live board's (dist/current.json); a push or a manual run always builds.
  # A payload that can't be read skips the run, so it never ships the
  # committed, older file over a fresher live one.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo build=true >> "$GITHUB_OUTPUT"; exit 0; fi
          payload=$(curl -fsS https://drewhoover.com/cfb-streak-king/share/payload.json | jq -r .builtAt) || payload=
          live=$(curl -fsS https://drewhoover.com/cfb-all-time-records/current.json | jq -r .builtAt) || live=
          echo "payload built $payload; the live board's from $live"
          if [ -n "$payload" ] && [ "$payload" != "$live" ]; then echo build=true >> "$GITHUB_OUTPUT"; else echo build=false >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The running season from Streak King's published payload, on the
      # scheduled and manual runs; a push builds the committed
      # src/data/current.json. A failed fetch builds the committed file too.
      - if: github.event_name != 'push'
        run: node scripts/build-current.mjs || git checkout -- src/data/current.json
      # vite build, then scripts/prerender.mjs bakes both pages' markup in
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Bing and the other IndexNow engines to recrawl every page in the
  # sitemap once the deploy is live (scripts/indexnow.mjs). A failed ping
  # never fails the deploy (the script exits 0).
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs

  # The share worker (workers/share) bundles src/lib and the data, so it
  # ships with the site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token
  # made from the "Edit Cloudflare Workers" template
  # (gh secret set CLOUDFLARE_API_TOKEN --repo DrewHoo/cfb-all-time-records).
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3' # the devDependency's version, so by-hand and CI deploys match
          command: deploy -c workers/share/wrangler.jsonc
